services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ocop
      POSTGRES_PASSWORD: ocop_local_password
      POSTGRES_DB: ocop
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocop -d ocop"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ocop_postgres_data:/var/lib/postgresql/data

volumes:
  ocop_postgres_data:
